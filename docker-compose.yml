# Local / single-host stack for the Pharma Intelligence Platform.
# Production runs on Azure Container Apps / AKS (see deploy/); this file is the
# parity environment: Postgres + pgvector instead of SQLite, Redis instead of the
# in-process cache, Kafka instead of the in-process event bus.
#
#   docker compose up --build
#   -> API      http://localhost:8000/docs
#   -> Frontend http://localhost:3000
#
name: pharma-intel

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pharma
      POSTGRES_PASSWORD: pharma
      POSTGRES_DB: pharma
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharma -d pharma"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://pharma:pharma@postgres:5432/pharma
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: /app/data/artifacts
      VECTOR_BACKEND: pgvector
      CORS_ORIGINS: '["http://localhost:3000"]'
      JWT_SECRET: local-compose-secret-change-me
    ports:
      - "8000:8000"
    volumes:
      - artifacts:/app/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  # One-shot initialisation: schema + reference seed data.
  bootstrap:
    build:
      context: ./backend
    profiles: ["setup"]
    environment:
      DATABASE_URL: postgresql+psycopg://pharma:pharma@postgres:5432/pharma
      VECTOR_BACKEND: pgvector
    command: ["python", "-m", "scripts.bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  artifacts:
