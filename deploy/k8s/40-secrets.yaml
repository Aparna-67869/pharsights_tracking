# ExternalSecret pulls the platform secrets from Azure Key Vault into a
# Kubernetes Secret. Requires the External Secrets Operator
# (https://external-secrets.io) and a workload identity federated credential
# for the pharma-intel service account.
#
# Nothing in this repo should ever contain a literal credential: the Key Vault
# is the single source of truth and rotation happens there.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: azure-key-vault
  namespace: pharma-intel
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "https://pharma-intel-kv.vault.azure.net"
      serviceAccountRef:
        name: pharma-intel
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pharma-intel-secrets
  namespace: pharma-intel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-key-vault
    kind: SecretStore
  target:
    name: pharma-intel-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: database-url
    - secretKey: redis-url
      remoteRef:
        key: redis-url
    - secretKey: kafka-bootstrap-servers
      remoteRef:
        key: kafka-bootstrap-servers
    - secretKey: jwt-secret
      remoteRef:
        key: jwt-secret
    - secretKey: azure-storage-connection-string
      remoteRef:
        key: azure-storage-connection-string
    - secretKey: azure-openai-endpoint
      remoteRef:
        key: azure-openai-endpoint
    - secretKey: azure-openai-api-key
      remoteRef:
        key: azure-openai-api-key
    - secretKey: slack-webhook-url
      remoteRef:
        key: slack-webhook-url
    - secretKey: teams-webhook-url
      remoteRef:
        key: teams-webhook-url
